# Makes a release on request: Actions › release › Run workflow (on main).
# Checks the version, runs all tests, builds the source archive and the image
# ghcr.io/azentrius/sharewerk:VERSION with signed build provenance, and creates the tag vVERSION
# with a GitHub release (archive, SHA256SUMS, notes from CHANGELOG.md).
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.1.0 (empty: __version__ in app/__init__.py)"
        required: false
        default: ""
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write     # tag and release
  packages: write     # push the image
  id-token: write     # sign the build provenance
  attestations: write # store the build provenance

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/azentrius/sharewerk

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main only (this run: $GITHUB_REF)."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          code=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' app/__init__.py)
          version=${INPUT_VERSION:-$code}
          version=${version#v}
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::\"$version\" is not a version like 0.1.0."
            exit 1
          fi
          if [ "$version" != "$code" ]; then
            echo "::error::Version $version differs from __version__ in app/__init__.py ($code). Change app/__init__.py first."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version exists already."
            exit 1
          fi
          if ! tools/release-notes.sh "$version" > /dev/null; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
      - name: Install the dependencies and the pinned check tools
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check
      - name: Tests
        run: python -m pytest -q

      - name: Source archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git archive --format=tar.gz --prefix="sharewerk-$VERSION/" -o "sharewerk-$VERSION.tar.gz" "$GITHUB_SHA"
          sha256sum "sharewerk-$VERSION.tar.gz" > SHA256SUMS

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - id: build
        name: Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build provenance for the source archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sharewerk-${{ steps.version.outputs.version }}.tar.gz
      - name: Build provenance for the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tools/release-notes.sh "$VERSION" > notes.md
          {
            echo
            echo "### Install"
            echo
            echo "The image of this release keeps the gallery-dl and yt-dlp of its build day. For the newest downloaders use \`latest\`, which is rebuilt every week."
            echo
            echo '```sh'
            echo "docker pull $IMAGE:$VERSION"
            echo "gh attestation verify oci://$IMAGE:$VERSION --repo $GITHUB_REPOSITORY"
            echo '```'
            echo
            echo "Source archive: download it and \`SHA256SUMS\`, then check that the download is complete and that this repository's release workflow built it:"
            echo
            echo '```sh'
            echo "sha256sum -c SHA256SUMS"
            echo "gh attestation verify sharewerk-$VERSION.tar.gz --repo $GITHUB_REPOSITORY"
            echo '```'
          } >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -- --target "$GITHUB_SHA" --title "Sharewerk $VERSION" --notes-file notes.md
          if [ "$PRERELEASE" = "true" ]; then
            set -- "$@" --prerelease
          fi
          gh release create "v$VERSION" "sharewerk-$VERSION.tar.gz" SHA256SUMS "$@"
